<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webcam Unicode Grayscale</title>
    <style>
        #ascii {
            font-size: 8pt;
            line-height: 1;
        }

        .gray-grid {
            border-collapse: collapse;
            table-layout: fixed;
            line-height: 0;
        }

        .gray-grid td {
            width: 10px;
            height: 10px;
            padding: 0;
            border: 0;
        }
    </style>
</head>

<body>

    <pre id="ascii"></pre>
    <div id="container"></div>

    <script>


        async function start(width, height, frameRate, frameRenderingCallback) {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: {
                    width: { ideal: width },
                    height: { ideal: height },
                    frameRate: { ideal: frameRate }
                }
            });

            const video = document.createElement("video");
            video.playsInline = true;
            video.muted = true;
            video.srcObject = stream;
            await video.play();

            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;

            const ctx = canvas.getContext("2d", { willReadFrequently: true });

            let active = true;

            const onVideoFrame = () => {
                if (!active) return;

                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);

                frameRenderingCallback(imageData);

                if ("requestVideoFrameCallback" in video) {
                    video.requestVideoFrameCallback(onVideoFrame);
                } else {
                    requestAnimationFrame(onVideoFrame);
                }
            };

            if ("requestVideoFrameCallback" in video) {
                video.requestVideoFrameCallback(onVideoFrame);
            } else {
                requestAnimationFrame(onVideoFrame);
            }

            return () => {
                active = false;
                stream.getTracks().forEach(track => track.stop());
            };

        }

        function getGray(r, g, b, _alpha) {
            return 0.299 * r + 0.587 * g + 0.114 * b;
        }

        function calculateGrayscaleFrame(image) {
            const { width, height, data } = image;

            const frame = [];

            const grayData = Array.from({ length: data.length / 4 }, (_, i) => {
                const chunk = data.slice(i * 4, i * 4 + 4);
                return getGray(...chunk);
            });

            const grayMin = Math.min(...grayData);
            const grayMax = Math.max(...grayData);

            const range = grayMax - grayMin;

            for (let y = 0; y < height; y++) {

                const row = [];

                for (let x = 0; x < width; x++) {
                    const index = y * width + x;
                    const gray = grayData[index];

                    const normalizedGray = range === 0 ? 0 : (gray - grayMin) / range;

                    row.push(normalizedGray)
                }

                frame.push(row)
            }

            return frame;
        }

        function renderFrameOfGraysAscii(frame, element, ascii_scale) {
            let text = "";
            frame.forEach(row => {
                row.forEach(pixelValue => {
                    const idx = Math.floor(pixelValue * (ascii_scale.length - 1));
                    text += ASCII[idx];
                })
                text += "\n";
            });

            element.textContent = text;
        }

        function renderGrayTable(matrix, container) {
            const table = document.createElement("table");
            table.className = "gray-grid";

            // DocumentFragment riduce i reflow del browser durante la creazione
            const fragment = document.createDocumentFragment();

            for (let r = 0; r < matrix.length; r++) {
                const tr = document.createElement("tr");
                const row = matrix[r];

                for (let c = 0; c < row.length; c++) {
                    const v = Math.max(0, Math.min(255, Math.round(255 * row[c])));
                    const td = document.createElement("td");
                    td.style.backgroundColor = `rgb(${v}, ${v}, ${v})`;
                    tr.appendChild(td);
                }

                fragment.appendChild(tr);
            }

            table.appendChild(fragment);
            container.replaceChildren(table);
        }

        function renderAscii(image) {
            // const ASCII = " .:-=+*#%@";
            // const ASCII = " ·⠂⠆⠇⠧⠷⠿⣿";
            // const ASCII = " ░░▒▒▓▓██".split('').reverse().join('');
            // const ASCII = " .'`^\",:;Il!i><~+_-?][}{1)(|\\/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$".split('').reverse().join('');
            // const ASCII = " ▁▁▂▂▃▃▄▅▅▆▆▇▇█".split('').reverse().join('');
            // const ASCII = " ░▒▓██".split('').reverse().join('');
            // const ASCII = " ░▒▓▁▂▃▄▅▆▇█".split('').reverse().join('');
            // const ASCII = "▁▂▃▄▅▆▇█".split('').reverse().join('');
            // const ASCII = "▊▋▋▌▍▎▏ ";

            const ASCII = "⠁⠃⠇⡇⣷⣿░▒▓██".split("").reverse().join("");
            const frame = calculateGrayscaleFrame(image);
            renderFrameOfGraysAscii(frame, document.getElementById("ascii"), ASCII);
        }

        function renderAsTable(image) {
            const frame = calculateGrayscaleFrame(image);
            renderGrayTable(frame, document.getElementById("container"));
        }

        start(50, 50, 10, renderAsTable);
    </script>
</body>

</html>
